<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduVision School Website</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 24px;
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.4);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 32px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
      max-width: 360px;
      text-align: center;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <img class="logo" src="../assets/icon.png" alt="EduVision">
  <h1>EduVision School Website</h1>
  <p>Starting your school platform...</p>
  <div class="spinner"></div>
  <div class="status" id="status">Checking local services...</div>
  <script>
    window.electronAPI?.onStatus?.((_, message) => {
      document.getElementById('status').textContent = message;
    });
  </script>
</body>
</html>
